name: Bug report
description: Something does not work as documented.
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not paste personal data, private records, tokens or file paths you would not publish. A security problem goes through the [security policy](https://github.com/hey-mori/.github/blob/main/SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest steps that show it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: The version or commit, and the operating system and browser if relevant.
    validations:
      required: true
